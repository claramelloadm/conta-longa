<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta Longa</title>
    <style>
        @font-face {
            font-family: 'Century Gothic';
            src: local('Century Gothic Bold'), local('CenturyGothic-Bold');
            font-weight: bold;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Century Gothic', Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #333;
            width: auto;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container" id="contaLonga"></div>

    <script>
        function gerarLuasFixas(anoBase) {
            return [
                { nome: "Lua 1: Lua Magnética do Morcego - Lua do Propósito", inicio: new Date(anoBase, 6, 26), totem: "Morcego" },
                { nome: "Lua 2: Lua Lunar do Escorpião - Lua do Desafio", inicio: new Date(anoBase, 7, 23), totem: "Escorpião" },
                { nome: "Lua 3: Lua Elétrica do Veado - Lua do Serviço", inicio: new Date(anoBase, 8, 20), totem: "Veado" },
                { nome: "Lua 4: Lua Autoexistente da Coruja - Lua da Forma", inicio: new Date(anoBase, 9, 18), totem: "Coruja" },
                { nome: "Lua 5: Lua Harmônica do Pavão - Lua da Radiação", inicio: new Date(anoBase, 10, 15), totem: "Pavão" },
                { nome: "Lua 6: Lua Rítmica do Lagarto - Lua da Igualdade", inicio: new Date(anoBase, 11, 13), totem: "Lagarto" },
                { nome: "Lua 7: Lua Ressonante do Macaco - Lua da Sintonização", inicio: new Date(anoBase + 1, 0, 10), totem: "Macaco" },
                { nome: "Lua 8: Lua Galáctica do Falcão - Lua da Integridade", inicio: new Date(anoBase + 1, 1, 7), totem: "Falcão" },
                { nome: "Lua 9: Lua Solar do Jaguar - Lua da Intenção", inicio: new Date(anoBase + 1, 2, 7), totem: "Jaguar" },
                { nome: "Lua 10: Lua Planetária do Cachorro - Lua da Manifestação", inicio: new Date(anoBase + 1, 3, 4), totem: "Cachorro" },
                { nome: "Lua 11: Lua Espectral da Serpente - Lua da Liberação", inicio: new Date(anoBase + 1, 4, 2), totem: "Serpente" },
                { nome: "Lua 12: Lua Cristal do Coelho - Lua da Cooperação", inicio: new Date(anoBase + 1, 4, 30), totem: "Coelho" },
                { nome: "Lua 13: Lua Cósmica da Tartaruga - Lua da Presença", inicio: new Date(anoBase + 1, 5, 27), totem: "Tartaruga" }
            ];
        }

        function calcularDiaDaLuaEPlasma(dia, mes, ano) {
            const anoBase = mes < 7 || (mes === 7 && dia < 26) ? ano - 1 : ano;
            const luasFixas = gerarLuasFixas(anoBase);
            const dataEntrada = new Date(ano, mes - 1, dia);

            if (mes === 7 && dia === 25) {
                return { diaDaLua: 365, numeroLua: null };
            }

            for (let i = 0; i < luasFixas.length; i++) {
                const inicioLua = luasFixas[i].inicio;
                const proximaLua = i < luasFixas.length - 1 
                    ? luasFixas[i + 1].inicio 
                    : new Date(anoBase + 1, 6, 25);

                if (dataEntrada >= inicioLua && dataEntrada < proximaLua) {
                    const diaNaLua = Math.floor((dataEntrada - inicioLua) / (1000 * 60 * 60 * 24)) + 1;
                    return { diaDaLua: diaNaLua, numeroLua: i + 1 };
                }
            }
            return { diaDaLua: null, numeroLua: null };
        }

        function calcularAnel(ano, mes, dia) {
            const anoBase = 1987;
            const anoAjustado = (mes < 7 || (mes === 7 && dia < 26)) ? ano - 1 : ano;
            const anelAtual = ((anoAjustado - anoBase) % 52 + 52) % 52;
            return anelAtual;
        }

        function calcularGiroSiriano(ano) {
            const inicioNS0 = new Date(1987, 6, 26);
            const anosDesde1987 = ano - inicioNS0.getFullYear();
            const giroSiriano = Math.floor(anosDesde1987 / 52) + 1;
            return giroSiriano;
        }

        function exibirContaLonga() {
            const hoje = new Date();
            const dia = hoje.getDate();
            const mes = hoje.getMonth() + 1;
            const ano = hoje.getFullYear();

            const resultado = calcularDiaDaLuaEPlasma(dia, mes, ano);
            const anel = calcularAnel(ano, mes, dia);
            const giroSiriano = calcularGiroSiriano(ano);

            const contaLonga = mes === 7 && dia === 25 
                ? `NS${giroSiriano}.${anel}.365` 
                : `NS${giroSiriano}.${anel}.${resultado.numeroLua || 13}.${resultado.diaDaLua}`;

            document.getElementById("contaLonga").innerText = contaLonga;
        }

        window.onload = exibirContaLonga;
    </script>
</body>
</html>
